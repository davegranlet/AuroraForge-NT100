name: Verify current Aurora Forge source
on:
  push:
    branches: [main, "NT100-v2/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-checks:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test scripts/release/export-current-source.test.js animation/tools/analyze-2k26-animation-pair.test.js
      - run: node --check umbrella-app/electron/main.js
      - run: node --check umbrella-app/electron/services/tool-library-service.js
